name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out Vigía
        uses: actions/checkout@v7
        with:
          path: vigia

      - name: Check out radar-core
        uses: actions/checkout@v7
        with:
          repository: Arreketefo/radar-core
          ref: v0.1.0
          path: radar-core

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "vigia/uv.lock"

      - name: Install locked dependencies
        working-directory: vigia
        run: make vendor-core && uv sync --locked --dev

      - name: Run tests
        working-directory: vigia
        run: uv run pytest -q

      - name: Run Ruff
        working-directory: vigia
        run: uv run ruff check .

      - name: Run mypy
        working-directory: vigia
        run: uv run mypy vigia

      - name: Build distributions
        working-directory: vigia
        run: uv build

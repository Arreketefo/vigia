[project]
name = "vigia"
version = "0.1.0"
description = "Travel deal radar with robust price-drop detection and live repricing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oscar Aguilar Ramos" }]
requires-python = ">=3.12"
keywords = [
    "anomaly-detection",
    "asyncio",
    "price-monitoring",
    "telegram-bot",
    "travel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "radar-core",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "holidays>=0.50",
]

[project.urls]
Homepage = "https://github.com/Arreketefo/vigia"
Repository = "https://github.com/Arreketefo/vigia"
Issues = "https://github.com/Arreketefo/vigia/issues"
Changelog = "https://github.com/Arreketefo/vigia/blob/main/CHANGELOG.md"

# radar-core is versioned independently and vendored into the build context by
# `make vendor-core` (git-ignored; refreshed from ../radar-core).
[tool.uv.sources]
radar-core = { path = "vendor/radar-core" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
